name: ASTRA-CLEAN CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Astrodynamics & GNC Engine Tests
  # -------------------------------------------------------------
  backend-unit-tests:
    name: Backend Unit Tests & GNC Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Run GNC Astrodynamics Unit Tests (Clohessy-Wiltshire, ZEM/ZEV, Thrusters)
        run: |
          python -m unittest simulation/test_gnc.py

      - name: Run FastAPI REST Endpoints & Safety Guard Unit Tests
        run: |
          python -m unittest backend/tests/test_api.py

  # -------------------------------------------------------------
  # Job 2: Next.js Frontend Type-Check & Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Vercel Readiness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws/telemetry"

  # -------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # -------------------------------------------------------------
  docker-build:
    name: Docker Containerization Check
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: astra-clean/backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: astra-clean/frontend:latest
